name: Flutter Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'

    - name: Install dependencies & Build APK
      run: |
        if [ -d "zadam_final" ]; then
          cd zadam_final
        fi
        flutter pub get
        flutter build apk --release
        mkdir -p ../build/app/outputs/flutter-apk/ 2>/dev/null || true
        cp build/app/outputs/flutter-apk/app-release.apk ../build/app/outputs/flutter-apk/ 2>/dev/null || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: zadam-app-release
        path: "**/app-release.apk"
